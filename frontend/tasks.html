{% extends "base.html" %}{% block title %}Tasks — ResortOS{% endblock %}{% block body %}<div class="app-shell">{% include "sidebar.html" %}<main class="main"><div class="topbar"><div><p class="eyebrow">SMART OPERATIONS</p><h1>Tasks & Assignments</h1></div><button class="btn primary" onclick="openTaskModal()">+ Assign Task</button></div><div class="stats-grid mini" id="taskStats"></div><div class="panel table-panel"><div class="panel-head"><div class="tabs"><button class="active">All Tasks</button><button>Pending</button><button>In Progress</button><button>Completed</button></div></div><div class="table-scroll"><table><thead><tr><th>Task</th><th>Room / Area</th><th>Assigned to</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody id="taskBody"></tbody></table></div></div></main></div><div class="modal" id="taskModal"><div class="modal-card"><button class="modal-close" onclick="closeModal('taskModal')">×</button><p class="eyebrow">ASSIGN WORK</p><h2>New Task</h2><form onsubmit="createTask(event)"><div class="form-grid"><label>Task title<input id="taskTitle" required></label><label>Type<select id="taskType"><option>Cleaning</option><option>Repair</option><option>Inspection</option><option>Kitchen</option><option>General</option></select></label><label>Room / Area<input id="taskRoom"></label><label>Priority<select id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>Assign to<select id="taskAssignee"></select></label></div><button class="btn primary wide">Assign Task</button></form></div></div>{% endblock %}{% block scripts %}<script>loadTasks();</script>{% endblock %}
